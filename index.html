<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="start-screen">
      <h1>Gym Tracker</h1>
      <p id="next-day-label"></p>
      <button id="start-btn">Start Today</button>
    </div>

    <div id="workout-screen" style="display:none">
      <h2 id="day-title"></h2>
      <h3>Main (required)</h3>
      <div id="main-list"></div>
      <h3>Extra (optional)</h3>
      <div id="extra-list"></div>
      <button id="finish-btn" disabled>Finish Today</button>
    </div>
  </div>

  <div id="modal-overlay" style="display:none">
    <div id="modal-content">
      <img id="modal-gif" src="" alt="">
    </div>
  </div>

<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
